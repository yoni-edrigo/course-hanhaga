<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>נוכחות</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1a1a1a; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --ok: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px; max-width: 720px; margin-inline: auto;
  }
  .header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
  h1 { font-size: 22px; margin: 0; }
  #status { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: #e5e7eb; color: var(--muted); white-space: nowrap; }
  #status.synced { background: #dcfce7; color: #166534; }
  #status.pending { background: #fef3c7; color: #92400e; }
  #status.offline { background: #fee2e2; color: #991b1b; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  select, input[type="date"] {
    width: 100%; padding: 10px 12px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; font-family: inherit;
  }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }

  /* Mode segmented control */
  .mode {
    display: flex; background: #eef2f6; border-radius: 10px; padding: 4px; margin-bottom: 14px;
  }
  .mode button {
    flex: 1; background: transparent; color: var(--muted); padding: 10px;
    font-size: 15px; font-weight: 600; border: 0; border-radius: 7px; cursor: pointer;
    font-family: inherit; transition: background .15s;
  }
  .mode button.active { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.06); }

  .student {
    display: flex; align-items: center; gap: 12px;
    padding: 12px; border-bottom: 1px solid var(--line);
    cursor: pointer; user-select: none;
  }
  .student:last-child { border-bottom: 0; }
  .student input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--ok); flex-shrink: 0; }
  .student.present { background: #f0fdf4; }
  /* In bus mode: student absent from main session */
  .student.absent-main { background: #fef2f2; }
  .student.absent-main.present { background: #fef0ee; }
  .student .meta { font-size: 12px; color: var(--muted); margin-inline-start: auto; }
  .name { font-size: 17px; }
  .actions { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0; margin-top: 8px; }
  button.save {
    width: 100%; padding: 14px; font-size: 17px; font-weight: 600;
    background: var(--accent); color: white; border: 0; border-radius: 10px;
    cursor: pointer; font-family: inherit;
  }
  button.save:disabled { opacity: 0.5; cursor: not-allowed; }
  .muted { color: var(--muted); font-size: 14px; padding: 12px; text-align: center; }
  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: #111; color: #fff; padding: 10px 16px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; }
  .summary-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; color: var(--muted); }
  .toolbar a { color: var(--accent); cursor: pointer; text-decoration: underline; margin-inline-start: 8px; }
  .legend { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend .swatch { display: inline-block; width: 10px; height: 10px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 2px; margin-inline-end: 4px; vertical-align: middle; }
</style>
</head>
<body>

<div class="header">
  <h1>רישום נוכחות</h1>
  <span id="status">…</span>
</div>

<div class="mode">
  <button id="mode-group" class="active">מפגש</button>
  <button id="mode-bus">אוטובוס</button>
</div>

<div class="card">
  <div class="row">
    <div>
      <label for="key" id="keyLabel">קבוצה</label>
      <select id="key"><option>טוען…</option></select>
    </div>
    <div>
      <label for="date">תאריך</label>
      <input type="date" id="date" />
    </div>
  </div>
</div>

<div class="card" id="rosterCard">
  <div class="summary-row">
    <span id="summary">בחרו קבוצה</span>
    <span class="toolbar">
      <a id="markAll">סמן הכל</a>
      <a id="clearAll">נקה</a>
    </span>
  </div>
  <div id="roster"></div>
  <div class="legend" id="legend" style="display:none">
    <span class="swatch"></span> תלמיד לא נוכח במפגש
  </div>
</div>

<div class="actions">
  <button class="save" id="save" disabled>שמירת נוכחות</button>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyfm5UvONXmBVoLjjAFICxCGutGdz2hUZrUt94DVhgsC6svdE_sSHPwNQs9TX7um9SF/exec';

// ═══════════════════════════════════════════════════════════════
// IndexedDB — separate stores for group and bus data
// ═══════════════════════════════════════════════════════════════
const DB_NAME = 'attendance-app';
const DB_VERSION = 2;
let _db;

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('meta'))          db.createObjectStore('meta');
      if (!db.objectStoreNames.contains('rosters'))       db.createObjectStore('rosters');
      if (!db.objectStoreNames.contains('attendance'))    db.createObjectStore('attendance');
      if (!db.objectStoreNames.contains('busRosters'))    db.createObjectStore('busRosters');
      if (!db.objectStoreNames.contains('busAttendance')) db.createObjectStore('busAttendance');
    };
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
function idbGet(store, key) {
  return new Promise((res, rej) => {
    const r = _db.transaction(store).objectStore(store).get(key);
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
function idbPut(store, key, value) {
  return new Promise((res, rej) => {
    const r = _db.transaction(store, 'readwrite').objectStore(store).put(value, key);
    r.onsuccess = () => res();
    r.onerror   = () => rej(r.error);
  });
}
function idbAll(store) {
  return new Promise((res, rej) => {
    const items = [];
    const r = _db.transaction(store).objectStore(store).openCursor();
    r.onsuccess = () => {
      const c = r.result;
      if (c) { items.push({ key: c.key, value: c.value }); c.continue(); }
      else res(items);
    };
    r.onerror = () => rej(r.error);
  });
}

// ═══════════════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════════════
async function api(action, payload = {}) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'שגיאה');
  return json.data;
}

// ═══════════════════════════════════════════════════════════════
// DOM
// ═══════════════════════════════════════════════════════════════
const $ = s => document.querySelector(s);
const keySel = $('#key'), keyLabel = $('#keyLabel'), dateInp = $('#date');
const rosterEl = $('#roster'), summaryEl = $('#summary'), saveBtn = $('#save');
const toastEl = $('#toast'), statusEl = $('#status'), legendEl = $('#legend');

const LS_MODE = 'attendance.mode';
const LS_GROUP = 'attendance.group';
const LS_BUS   = 'attendance.bus';

let mode = localStorage.getItem(LS_MODE) || 'group'; // 'group' | 'bus'
let currentRoster = []; // [{ rowIndex, firstName, lastName, present, groupPresent? }]
let loadToken = 0;

dateInp.value = new Date().toISOString().slice(0, 10);

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2200);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// Per-mode config — keeps the rest of the code generic
const modeCfg = {
  group: {
    label: 'קבוצה',
    listAction: 'getGroups',
    rosterAction: 'getRoster',
    saveAction: 'saveAttendance',
    keyField: 'group',
    lsKey: LS_GROUP,
    listStore: 'meta',
    listIdbKey: 'groups',
    rosterStore: 'rosters',
    attStore: 'attendance',
    pickPlaceholder: 'בחרו קבוצה'
  },
  bus: {
    label: 'אוטובוס',
    listAction: 'getBuses',
    rosterAction: 'getBusRoster',
    saveAction: 'saveBusAttendance',
    keyField: 'bus',
    lsKey: LS_BUS,
    listStore: 'meta',
    listIdbKey: 'buses',
    rosterStore: 'busRosters',
    attStore: 'busAttendance',
    pickPlaceholder: 'בחרו אוטובוס'
  }
};

function cfg() { return modeCfg[mode]; }
const attKey = (k, d) => `${k}|${d}`;

// ═══════════════════════════════════════════════════════════════
// Mode switch
// ═══════════════════════════════════════════════════════════════
function setMode(next) {
  if (next === mode) return;
  mode = next;
  localStorage.setItem(LS_MODE, mode);
  $('#mode-group').classList.toggle('active', mode === 'group');
  $('#mode-bus').classList.toggle('active', mode === 'bus');
  keyLabel.textContent = cfg().label;
  legendEl.style.display = mode === 'bus' ? 'block' : 'none';
  currentRoster = [];
  rosterEl.innerHTML = '';
  summaryEl.textContent = cfg().pickPlaceholder;
  saveBtn.disabled = true;
  loadList();
}

$('#mode-group').addEventListener('click', () => setMode('group'));
$('#mode-bus').addEventListener('click', () => setMode('bus'));

// ═══════════════════════════════════════════════════════════════
// Sync status
// ═══════════════════════════════════════════════════════════════
async function updateSyncStatus() {
  const all = [...await idbAll('attendance'), ...await idbAll('busAttendance')];
  const dirty = all.filter(({ value }) => value && value.dirty).length;
  const online = navigator.onLine;
  statusEl.classList.remove('synced', 'pending', 'offline');
  if (!online) { statusEl.textContent = 'אופליין'; statusEl.classList.add('offline'); }
  else if (dirty) { statusEl.textContent = `ממתין לסנכרון (${dirty})`; statusEl.classList.add('pending'); }
  else { statusEl.textContent = 'מסונכרן'; statusEl.classList.add('synced'); }
}

// ═══════════════════════════════════════════════════════════════
// Render
// ═══════════════════════════════════════════════════════════════
function updateSummary() {
  if (!currentRoster.length) { summaryEl.textContent = ''; return; }
  const n = currentRoster.filter(s => s.present).length;
  summaryEl.textContent = `${n} / ${currentRoster.length} נוכחים`;
}

function renderRoster() {
  if (!currentRoster.length) {
    rosterEl.innerHTML = '<div class="muted">אין רשומות</div>';
    summaryEl.textContent = '';
    return;
  }
  updateSummary();
  rosterEl.innerHTML = currentRoster.map((s, i) => {
    const classes = ['student'];
    if (s.present) classes.push('present');
    if (mode === 'bus' && s.groupPresent === false) classes.push('absent-main');
    const meta = (mode === 'bus' && s.group) ? `<span class="meta">קב ${escapeHtml(s.group)}</span>` : '';
    return `
      <label class="${classes.join(' ')}" data-i="${i}">
        <input type="checkbox" ${s.present ? 'checked' : ''} />
        <span class="name">${escapeHtml(s.firstName)} ${escapeHtml(s.lastName)}</span>
        ${meta}
      </label>
    `;
  }).join('');

  rosterEl.querySelectorAll('.student').forEach(el => {
    const i = +el.dataset.i;
    const cb = el.querySelector('input');
    cb.addEventListener('change', () => {
      currentRoster[i].present = cb.checked;
      el.classList.toggle('present', cb.checked);
      updateSummary();
    });
  });
}

function setAll(val) { currentRoster.forEach(s => s.present = val); renderRoster(); }

// ═══════════════════════════════════════════════════════════════
// List (groups/buses) — stale-while-revalidate
// ═══════════════════════════════════════════════════════════════
async function loadList() {
  const c = cfg();
  const cached = await idbGet(c.listStore, c.listIdbKey);
  if (cached) renderListOptions(cached);

  try {
    const fresh = await api(c.listAction);
    await idbPut(c.listStore, c.listIdbKey, fresh);
    if (JSON.stringify(cached) !== JSON.stringify(fresh)) renderListOptions(fresh);
  } catch (e) {
    if (!cached) {
      keySel.innerHTML = '<option>שגיאה בטעינה</option>';
      toast('אין חיבור');
    }
  }
  updateSyncStatus();
}

function renderListOptions(items) {
  const c = cfg();
  keySel.innerHTML =
    `<option value="">— בחרו —</option>` +
    items.map(x => `<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join('');
  const saved = localStorage.getItem(c.lsKey);
  if (saved && items.includes(saved)) {
    keySel.value = saved;
    loadRoster();
  } else {
    summaryEl.textContent = c.pickPlaceholder;
  }
}

// ═══════════════════════════════════════════════════════════════
// Roster + attendance
// ═══════════════════════════════════════════════════════════════
async function loadRoster() {
  const c = cfg();
  const key = keySel.value;
  const date = dateInp.value;
  const token = ++loadToken;

  if (!key) {
    currentRoster = [];
    rosterEl.innerHTML = '';
    summaryEl.textContent = c.pickPlaceholder;
    saveBtn.disabled = true;
    return;
  }

  // 1. Instant render from cache
  const cachedRoster = await idbGet(c.rosterStore, key);
  const cachedAtt = await idbGet(c.attStore, attKey(key, date));

  if (cachedRoster) {
    const presentMap = {};
    (cachedAtt?.records || []).forEach(r => {
      presentMap[r.firstName + '||' + r.lastName] = !!r.present;
    });
    currentRoster = cachedRoster.map(s => ({
      ...s,
      present: !!presentMap[s.firstName + '||' + s.lastName]
    }));
    renderRoster();
    saveBtn.disabled = currentRoster.length === 0;
  } else {
    summaryEl.textContent = 'טוען…';
    rosterEl.innerHTML = '';
  }

  // 2. Fresh from server
  try {
    const fresh = await api(c.rosterAction, { [c.keyField]: key, date });
    if (token !== loadToken) return;

    // Cache the roster (without per-date state)
    const rosterOnly = fresh.map(s => {
      const { present, ...rest } = s;
      return rest;
    });
    await idbPut(c.rosterStore, key, rosterOnly);

    if (!cachedAtt?.dirty) {
      const records = fresh.map(s => ({
        rowIndex: s.rowIndex,
        firstName: s.firstName, lastName: s.lastName,
        present: !!s.present
      }));
      await idbPut(c.attStore, attKey(key, date), {
        key, date, records, dirty: false, syncedAt: Date.now()
      });
      currentRoster = fresh.map(s => ({ ...s, present: !!s.present }));
      renderRoster();
      saveBtn.disabled = currentRoster.length === 0;
    }
  } catch (e) {
    if (!cachedRoster) summaryEl.textContent = 'אין חיבור ולא נמצא מטמון';
  }
  updateSyncStatus();
}

// ═══════════════════════════════════════════════════════════════
// Save
// ═══════════════════════════════════════════════════════════════
async function save() {
  const c = cfg();
  const key = keySel.value, date = dateInp.value;
  if (!key || !date) { toast('בחרו ' + c.label + ' ותאריך'); return; }
  if (!currentRoster.length) { toast('אין רשומות לשמור'); return; }

  const originalLabel = saveBtn.textContent;
  saveBtn.disabled = true;
  saveBtn.textContent = 'שומר…';

  const records = currentRoster.map(s => ({
    rowIndex: s.rowIndex,
    firstName: s.firstName, lastName: s.lastName,
    present: !!s.present
  }));

  // 1. Local save first — instant, durable, survives network failure
  try {
    await idbPut(c.attStore, attKey(key, date), {
      key, date, records, dirty: true, savedAt: Date.now()
    });
  } catch (e) {
    saveBtn.disabled = false;
    saveBtn.textContent = originalLabel;
    toast('שגיאה בשמירה מקומית: ' + e.message);
    return;
  }
  updateSyncStatus();

  // 2. Try server sync immediately; report real outcome
  if (!navigator.onLine) {
    toast('נשמר מקומית – יסתנכרן כשיחזור החיבור');
  } else {
    try {
      await api(c.saveAction, { [c.keyField]: key, date, records });
      await idbPut(c.attStore, attKey(key, date), {
        key, date, records, dirty: false, syncedAt: Date.now()
      });
      toast('נשמר ✓');
    } catch (e) {
      // Stays dirty in IDB; background sync will retry
      toast('נשמר מקומית – שגיאת שרת: ' + (e.message || 'לא ידוע'));
    }
  }

  updateSyncStatus();
  saveBtn.disabled = false;
  saveBtn.textContent = originalLabel;
}

async function trySyncOne(m, key, date) {
  const c = modeCfg[m];
  const entry = await idbGet(c.attStore, attKey(key, date));
  if (!entry || !entry.dirty) return;
  try {
    await api(c.saveAction, { [c.keyField]: key, date, records: entry.records });
    await idbPut(c.attStore, attKey(key, date), {
      ...entry, dirty: false, syncedAt: Date.now()
    });
  } catch (e) { /* stays dirty */ }
  updateSyncStatus();
}

async function syncAllDirty() {
  for (const m of ['group', 'bus']) {
    const c = modeCfg[m];
    const all = await idbAll(c.attStore);
    for (const { value } of all) {
      if (value && value.dirty) await trySyncOne(m, value.key, value.date);
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// Wire-up
// ═══════════════════════════════════════════════════════════════
keySel.addEventListener('change', () => {
  localStorage.setItem(cfg().lsKey, keySel.value);
  loadRoster();
});
dateInp.addEventListener('change', loadRoster);
$('#markAll').addEventListener('click', () => setAll(true));
$('#clearAll').addEventListener('click', () => setAll(false));
saveBtn.addEventListener('click', save);

window.addEventListener('online',  () => { updateSyncStatus(); syncAllDirty(); });
window.addEventListener('offline', updateSyncStatus);
setInterval(syncAllDirty, 30000);

(async () => {
  _db = await openDB();
  // Initial UI from saved mode
  $('#mode-group').classList.toggle('active', mode === 'group');
  $('#mode-bus').classList.toggle('active', mode === 'bus');
  keyLabel.textContent = cfg().label;
  legendEl.style.display = mode === 'bus' ? 'block' : 'none';
  summaryEl.textContent = cfg().pickPlaceholder;

  await updateSyncStatus();
  await syncAllDirty();
  await loadList();
})();
</script>
</body>
</html>
